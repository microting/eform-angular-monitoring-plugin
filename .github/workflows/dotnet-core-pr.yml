name: .NET Pull requests

on:
  pull_request:
    branches: [ master, stable, angular19 ]
    paths-ignore:
    - '**.md'

jobs:
  monitoring-test-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build eFormAPI/Plugins/Monitoring.Pn/Monitoring.Pn.sln
    - name: Unit Tests
      run: dotnet test -v n eFormAPI/Plugins/Monitoring.Pn/Monitoring.Pn.Test/Monitoring.Pn.Test.csproj

  monitoring-test-angular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: eform-angular-monitoring-plugin
    - name: Preparing Frontend checkout
      uses: actions/checkout@v4
      with:
        repository: microting/eform-angular-frontend
        ref: ${{ github.base_ref }}
        path: eform-angular-frontend
    - name: Copy dependencies
      run: |
        cp -av eform-angular-monitoring-plugin/eform-client/src/app/plugins/modules/monitoring-pn eform-angular-frontend/eform-client/src/app/plugins/modules/monitoring-pn
        cd eform-angular-frontend/eform-client && ../../eform-angular-monitoring-plugin/testinginstallpn.sh
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Enable Corepack
      run: corepack enable
    - name: yarn install
      run: cd eform-angular-frontend/eform-client && yarn install
    - name: Run monitoring-pn unit tests
      run: cd eform-angular-frontend/eform-client && npx jest --ci --maxWorkers=2 --passWithNoTests "src/app/plugins/modules/monitoring-pn/"

  monitoring-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        path: eform-angular-monitoring-plugin
    - name: Preparing Frontend checkout
      uses: actions/checkout@v4
      with:
        repository: microting/eform-angular-frontend
        ref: ${{ github.base_ref }}
        path: eform-angular-frontend
    - name: Copy dependencies
      run: |
        cp -av eform-angular-monitoring-plugin/eform-client/src/app/plugins/modules/monitoring-pn eform-angular-frontend/eform-client/src/app/plugins/modules/monitoring-pn
        cd eform-angular-frontend/eform-client && ../../eform-angular-monitoring-plugin/testinginstallpn.sh
    - name: Copy Dockerfile
      run: cp eform-angular-monitoring-plugin/Dockerfile .
    - name: Build Docker image
      run: docker build . -t microtingas/eform-angular-monitoring-container:latest --build-arg GITVERSION=1.0.0 --build-arg PLUGINVERSION=1.0.0 --build-arg DISABLE_SENTRY=true
